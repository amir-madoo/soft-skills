<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b35">
  <meta name="description" content="An offline-capable learning tracker for Practical Judgment and Human Capability.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Practical Judgment — Learning tracker</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
    <a class="brand" href="#dashboard"><span class="brand-mark" aria-hidden="true">PJ</span><span>Practical Judgment</span></a>
    <span class="local-badge">Saved in this browser</span>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <nav>
        <a href="#dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#curriculum" data-nav="curriculum">Curriculum</a>
        <a href="#reviews" data-nav="reviews">Reviews</a>
        <a href="#capstones" data-nav="capstones">Capstones</a>
        <a href="#progress" data-nav="progress">Progress / Backup</a>
      </nav>
      <p class="sidebar-note">Your progress stays on this device unless you export it.</p>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">Loading curriculum…</div></main>
  </div>
  <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
